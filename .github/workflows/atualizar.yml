name: Atualizar ranking Itaberabão

on:
  schedule:
    - cron: '45 22 * * *'   # roda diariamente às 22h45 (horário de Brasília)
  workflow_dispatch:        # permite rodar manualmente

permissions:
  contents: write   # dá permissão para commit/push

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repositório
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Rodar script de atualização
        run: python itaberabao-ranking/python/atualizar.py

      - name: Commit e push dos dados
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Atualização automática de dados" || echo "Nada para commitar"
          git pull --rebase origin main   # sincroniza com o remoto
          git push
