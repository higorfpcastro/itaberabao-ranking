name: Atualizar ranking Itaberabão

on:
  schedule:
    # 22h45 no horário de Brasília (UTC-3)
    - cron: '45 1 * * *'

  workflow_dispatch:

# Impede duas atualizações automáticas simultâneas
concurrency:
  group: atualizar-ranking-itaberabao
  cancel-in-progress: false

permissions:
  contents: write

jobs:

  build:
    runs-on: ubuntu-latest

    steps:

      # ======================================================
      # CHECKOUT
      # ======================================================

      - name: Checkout repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      # ======================================================
      # SINCRONIZAÇÃO
      # ======================================================

      - name: Sincronizar com o repositório remoto
        run: |
          git fetch origin main
          git checkout main
          git reset --hard origin/main

      # ======================================================
      # PYTHON
      # ======================================================

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # ======================================================
      # DEPENDÊNCIAS
      # ======================================================

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ======================================================
      # ATUALIZAÇÃO
      # ======================================================

      - name: Rodar script de atualização
        run: |
          python python/atualizar.py

      # ======================================================
      # COMMIT
      # ======================================================

      - name: Commit e push dos dados
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add site/*.json

          git diff --cached --quiet || git commit -m "Atualização automática de dados"

          git push origin main
