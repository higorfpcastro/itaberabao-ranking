name: Atualizar ranking Itaberabão

on:
  schedule:
    - cron: '01 0 * * *'   # roda diariamente às 00h06 (horário de Brasília)
  workflow_dispatch:        # permite rodar manualmente

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Rodar script de atualização
        run: python python/atualizar.py

      - name: Commit e push dos dados
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git pull origin main || true
          git add -A
          git commit -m "Atualização automática de dados" || echo "Nada para commitar"
          git push

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4

      - name: Configurar Pages
        uses: actions/configure-pages@v4

      - name: Upload artefatos
        uses: actions/upload-pages-artifact@v3
        with:
          path: site   # publica tudo que está dentro da pasta site/

      - name: Publicar no GitHub Pages
        uses: actions/deploy-pages@v4
