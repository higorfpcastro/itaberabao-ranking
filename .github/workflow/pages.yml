name: Publicar GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4

      - name: Configurar Pages
        uses: actions/configure-pages@v4

      - name: Copiar dados para site
        run: |
          mkdir -p itaberabao-ranking/site/data
          cp -r itaberabao-ranking/data/* itaberabao-ranking/site/data/

      - name: Upload artefatos
        uses: actions/upload-pages-artifact@v3
        with:
          path: itaberabao-ranking/site   # publica index.html + data/

      - name: Publicar no GitHub Pages
        uses: actions/deploy-pages@v4
